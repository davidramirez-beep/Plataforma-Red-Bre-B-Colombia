# Copie este archivo a /etc/nginx/sites-available/breb y enlace sites-enabled.
# La API escucha solo en 127.0.0.1:5080. nginx es quien habla HTTPS en 443.
# No hay server en el puerto 80: un login por HTTP no debe existir.
# Los certificados los crea emitir-certificado.sh. Cambie las rutas si los mueve.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/breb/server.crt;
    ssl_certificate_key /etc/breb/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
